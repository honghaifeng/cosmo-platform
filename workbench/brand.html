<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品牌工作台 · 逆龄工作台</title>
<link rel="stylesheet" href="shared.css">
<style>
  .bhead{display:flex;align-items:flex-start;gap:22px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
  .bhead .nm{font-family:var(--serif);font-size:29px;line-height:1.15;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bhead .nm i{width:13px;height:13px;border-radius:2px;flex:0 0 13px}
  .bhead .nm em{font-style:normal;font-size:12.5px;font-family:var(--sans);color:var(--ink-3);font-weight:400;letter-spacing:0}
  .bhead .judge{margin-top:9px;font-size:13.5px;color:var(--ink-2);line-height:1.7;max-width:66ch}
  .bhead .side{flex:0 0 200px;text-align:right;font-size:12px;color:var(--ink-3);line-height:1.95}
  .bhead .side b{font-family:var(--mono);color:var(--ink);font-weight:500;font-size:14px}

  /* 平台矩阵 */
  .mtx{width:100%;border-collapse:collapse;font-size:12.5px}
  .mtx th{font-size:11px;font-weight:600;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--rule-2);text-align:right;white-space:nowrap;background:var(--paper-2)}
  .mtx th:first-child,.mtx th:nth-child(2){text-align:left}
  .mtx td{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .mtx td:first-child,.mtx td:nth-child(2){text-align:left;font-family:var(--sans)}
  .mtx tbody tr:hover{background:#eef1f6}
  .mtx .none{color:var(--ink-4)}

  /* 产品卡 */
  .prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .prod{border:1px solid var(--rule);border-radius:3px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
  .prod .ph{padding:13px 15px 11px;border-bottom:1px solid var(--rule)}
  .prod .ph .t{font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .prod .ph .m{font-size:11.5px;color:var(--ink-3);margin-top:4px}
  .prod .snd{padding:10px 15px;border-bottom:1px solid var(--rule);display:flex;gap:18px;background:var(--paper-2)}
  .prod .snd div{font-size:10.5px;color:var(--ink-4)}
  .prod .snd b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:500;margin-top:1px}
  .prod .specs{padding:11px 15px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:11.5px}
  .prod .specs .k{color:var(--ink-4);font-size:10.5px}
  .prod .specs .v{color:var(--void);border-bottom:1px dashed var(--rule-2);padding-bottom:2px}
  .blogo{height:30px;vertical-align:-8px;margin-right:8px;object-fit:contain;background:#fff;border:1px solid var(--rule);padding:2px 5px;border-radius:2px}
  .prod .pimg{height:150px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--rule)}
  .prod .pimg img{width:100%;height:100%;object-fit:contain;display:block}
  .prod .pimg span{font-size:11px;color:var(--ink-4)}
  .prod .pft{margin-top:auto;padding:9px 15px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:10px}
  .prod .pft a{font-size:11.5px;border-bottom:1px solid var(--rule-2)}

  /* 内容列表 */
  .clist{display:flex;flex-direction:column}
  .citem{display:grid;grid-template-columns:44px 1fr 60px 54px 58px 92px;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);align-items:center;font-size:12.5px}
  .citem .cth{width:44px;height:44px;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink-4);line-height:1.2;text-align:center}
  .citem .cth img{width:100%;height:100%;object-fit:cover;display:block}
  .citem .tt a{border-bottom:1px solid transparent}
  .citem .tt a:hover{border-bottom-color:var(--ink-3)}
  .citem:hover{background:#eef1f6}
  .citem:last-child{border-bottom:none}
  .citem .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .citem .au{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .citem .lk{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
  .filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:11px 16px;border-bottom:1px solid var(--rule);background:var(--paper-2)}
  .filters select,.filters button{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--rule-2);border-radius:2px;background:var(--card);color:var(--ink-2);cursor:pointer}
  .filters label{font-size:11.5px;color:var(--ink-3)}
  .filters input[type=search]{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--rule-2);border-radius:2px;background:var(--card);color:var(--ink-2)}
  /* 筛选结果摘要：一眼知道这批内容是什么构成 */
  .libsum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:9px 16px;border-bottom:1px solid var(--rule);
    font-size:12px;color:var(--ink-3);background:var(--card)}
  .libsum b{color:var(--ink);font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .libsum span+span{padding-left:16px;border-left:1px solid var(--rule)}

  /* 策略 */
  .strat{display:flex;flex-direction:column}
  .srow{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--rule)}
  .srow:last-child{border-bottom:none}
  .srow .lb{font-size:12px;color:var(--ink-3)}
  .srow .lb b{display:block;font-size:13px;color:var(--ink);font-weight:600;margin-bottom:3px}
  .srow .ct{font-size:13px;line-height:1.72;color:var(--ink-2)}
  .srow .ct .strong{color:var(--ink);font-weight:600}
  .srow .ct ul{margin:5px 0 0 16px}
  .srow .ct li{margin-bottom:3px}

  /* 作业 */
  .ops{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media(max-width:1080px){.ops{grid-template-columns:1fr}}
  .opcard{border:1px solid var(--rule);border-radius:3px;background:var(--card)}
  .opcard .h{padding:11px 15px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:9px}
  .opcard .h h3{font-size:13px}
  .opcard .h .spacer{flex:1}
  .opcard .b{padding:13px 15px}
  .opline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
  .opline:last-child{border-bottom:none}
  .opline .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .effbar{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule)}
  .effbar>div{background:var(--card);padding:13px 15px}
  .effbar .t{font-size:11.5px;color:var(--ink-3)}
  .effbar .n{font-family:var(--mono);font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
  .effbar .d{font-size:11px;color:var(--ink-4);margin-top:2px}
</style>
</head>
<body>
<div class="app">
  <nav class="rail"></nav>
  <main class="main">
    <div class="topbar"></div>
    <div class="body" id="app"></div>
  </main>
</div>
<script src="/api/wb/data.js"></script>
<script src="/api/wb/contents.js"></script>
<script src="/api/wb/plat.js"></script>
<script src="/api/wb/people.js"></script>
<script src="products.js?v=20261028c"></script>
<script src="/api/wb/media-cdn.js"></script>
<script src="shared.js?v=20261028c"></script>
<script>
/* 内容清单按品牌单独加载：不阻塞首屏，加载完再渲染（也避免 document.write 在部分环境下的顺序问题） */
(function () {
  var b = new URLSearchParams(location.search).get("brand") || "MitoQ";
  var el = document.createElement("script");
  el.src = "/api/wb/list.js?brand=" + slugOf(b);
  el.onload = function () { window.__bootBrand && window.__bootBrand(); };
  el.onerror = function () { window.__bootBrand && window.__bootBrand(); };
  document.head.appendChild(el);
})();
</script>
<script>
const Q = new URLSearchParams(location.search);
const KEY = Q.get("brand") || "MitoQ";
const TAB = Q.get("tab") || "overview";
const IS_CAT = KEY === "__category";

const TABS = [
  ["overview","概览"], ["products","产品"], ["channels","渠道与账号"], ["library","内容库"],
  ["performance","数据表现"], ["strategy","营销策略"], ["cost","成本与效果"], ["ops","生产作业"]
];

/* 产品线：产品名来自 config/brands.json 的 products，条数由 db 现算（data.js.prodline）
   下面这份只做「目录缺失时」的兜底，数字一律不写死 */
function prodline(brand) {
  const b = (typeof DATA !== "undefined" && DATA.brands && DATA.brands[brand]) || null;
  if (b && b.prodline && b.prodline.length) return b.prodline;
  return PRODLINE_FALLBACK[brand] || [];
}
const PRODLINE_FALLBACK = { __category: [] };

/* 判断文案不写数字：数字一律来自 data.js，写完就过时（踩过——数据库更新后文案还写着旧数）。
   这里只说结论，具体数字看右侧与下面各张表。 */
const JUDGE_NOTE = {
  MitoQ: "六家里最均衡的一家：官号与达人都在真实产出，达人侧单条峰值最高。要学的是它的选题与达人筛选，不是铺量。",
  LAIFE: "单爆品 + 官号矩阵铺量。一个产品扛起大半内容，官号把产品词铺满平台；但官号本身几乎没有互动，声量靠达人撑。",
  GRANVER: "产品线摊得太开：多条产品线同时推，官号基本空转，内容量铺了却换不回互动——看起来覆盖广，实际每条线都没打透。",
  "塞乐瑞": "投入了却没回声：达人数不少、互动全库最低，没有官号阵地，用户记住的是「干细胞」这个品类词，不是塞乐瑞。",
  "W+端粒塔": "小体量试水：官号零互动，靠 NMN 品类词寄生达人内容。内容量的月度起伏主要是采集窗口造成的，不代表真发力。",
  COSMOBOUNTY: "质量不差、量太少、没阵地：达人单条互动已接近对手水平，但没有官号、内容量只有对手的零头——不是内容不行，是根本没在做。",
};
function judgeText(brand) {
  const note = JUDGE_NOTE[brand] || "";
  const b = (typeof DATA !== "undefined" && DATA.brands && DATA.brands[brand]) || null;
  if (!b) return note;
  const e = b.eff, gap = b.viral1k ? Math.round(b.verified / b.viral1k) : 0;
  return note + (gap ? ` 已验讫 ${fmt(b.verified)} 条里，平均每 ${gap} 条出一条 ≥1000 赞的爆文。` : "");
}
function catJudge() {
  const c = DATA.category;
  const sumB = Object.values(DATA.brands).reduce((s, x) => s + x.likes_sum, 0);
  return `不是品牌，是赛道。${fmt(c.total)} 条泛品类场景内容拿到 ${fmt(c.likes_sum)} 赞，是六品牌总和（${fmt(sumB)}）的 ${sumB ? (c.likes_sum / sumB).toFixed(1) : "—"} 倍。用户搜的是「抗衰怎么办」「护肝吃什么」，不是品牌名。`;
}

const B = BRANDS.find(b => b.key === KEY) || BRANDS[0];
const D = IS_CAT ? null : DATA.brands[KEY];
const E = EFF[KEY] || { off_n:0, off_avg:0, off_viral:0, kol_n:0, kol_avg:0, kol_viral:0 };
const PENDING_N = D ? (D.total - D.verified) : 0;

renderRail(TAB === "overview" ? "brand" : null, IS_CAT ? null : KEY);
topbar(`<b>品牌</b> <span class="sep">/</span> <a href="brand.html?brand=${encodeURIComponent(KEY)}" style="border-bottom:1px dotted var(--ink-4)">${esc(IS_CAT?"品类大盘":B.cn)}</a> <span class="sep">/</span> ${TABS.find(t=>t[0]===TAB)?.[1]||"概览"}`,
  IS_CAT ? "参照系 · 不进横评" : "已验讫口径");

/* ================= 头部 ================= */
function head() {
  if (IS_CAT) return `<div class="bhead">
    <div style="flex:1"><div class="nm">品类大盘<em>赛道参照系</em></div>
    <div class="judge">${catJudge()}</div></div>
    <div class="side">内容 <b>${fmt(DATA.category.total)}</b><br>累计赞 <b>${fmt(DATA.category.likes_sum)}</b><br>均赞 <b>${fmt(DATA.category.likes_avg)}</b></div></div>`;
  const lg = (typeof BRAND_LOGOS!=="undefined") && BRAND_LOGOS[KEY];
  return `<div class="bhead">
    <div style="flex:1">
      <div class="nm">${lg?`<img class="blogo" src="${mediaPath(lg)}" alt="${esc(B.cn)} logo">`:`<i style="background:${B.color}"></i>`}${esc(B.cn)}<em>${esc(B.name!==B.cn?B.name:"")} · ${esc(B.note)}</em></div>
      <div class="judge">${judgeText(KEY)}</div>
    </div>
    <div class="side">
      内容 <b>${fmt(D.total)}</b> · 验讫 <b>${fmt(D.verified)}</b><br>
      官号 <b>${D.official_acc}</b> 个 · 达人 <b>${D.creators}</b> 位<br>
      累计赞 <b>${fmt(D.likes_sum)}</b> · 均 <b>${D.likes_avg}</b>
    </div></div>`;
}

/* ================= ① 概览 ================= */
function tabOverview() {
  if (IS_CAT) return catOverview();
  const pk = Object.entries(D.prod_kw), pMax = Math.max(...pk.map(x=>x[1]),1);
  const plats = Object.entries(D.platform).sort((a,b)=>b[1]-a[1]), plMax = Math.max(...plats.map(x=>x[1]),1);
  const L0 = brandList(KEY) || [];
  const recentRows = [...L0].sort((a,b)=>(b[5]>a[5]?1:-1)).slice(0,6).map(contentRow).join("");
  const topRows = [...L0].sort((a,b)=>b[4]-a[4]).slice(0,6).map(contentRow).join("");
  return `<div class="stack">
    <div class="kpis">
      <div class="kpi"><div class="k">产品档案</div><div class="v">${(typeof PRODUCTS!=="undefined"&&(PRODUCTS[KEY]||[]).length)||prodline(KEY).length}</div><div class="x">官网/店铺目录 · 规格成分价格带来源</div></div>
      <div class="kpi"><div class="k">内容（验讫）</div><div class="v">${fmt(D.verified)}</div><div class="x">总采集 ${fmt(D.total)}</div></div>
      <div class="kpi"><div class="k">官号 / 达人</div><div class="v sm">${D.official_acc} / ${D.creators}</div><div class="x">账号数</div></div>
      <div class="kpi"><div class="k">累计赞</div><div class="v">${fmt(D.likes_sum)}</div><div class="x">均 ${D.likes_avg} / 条</div></div>
      <div class="kpi"><div class="k">爆文（≥1000）</div><div class="v">${D.viral1k}</div><div class="x">≥1万 ${D.viral10k} 条</div></div>
    </div>

    <div class="g2">
      <div class="sheet">
        <div class="hd"><h2>产品声量占比</h2><div class="spacer"></div><span class="tag warn">内容侧推断</span></div>
        <div class="bd"><div class="bars">${pk.map(([k,v])=>barRow(k,v,pMax,B.color)).join("")}</div>
          <div class="tiny" style="margin-top:12px">按标题词频统计，不是官方产品目录。<a href="?brand=${encodeURIComponent(KEY)}&tab=products" style="border-bottom:1px dotted var(--ink-4)">看产品与缺口 →</a></div>
        </div>
      </div>
      <div class="sheet">
        <div class="hd"><h2>平台分布</h2><div class="spacer"></div><span class="tag">条数</span></div>
        <div class="bd"><div class="bars">${plats.map(([p,v])=>{
          const m = PLAT_META[p]||{name:p};
          return barRow(m.name, v, plMax, m.kind==="媒体"?"var(--ink-4)":B.color);
        }).join("")}</div>
          <div class="tiny" style="margin-top:12px">灰色 = 媒体收录类，无互动机制，不计入效果比较。</div>
        </div>
      </div>
    </div>

    <div class="sheet">
      <div class="hd"><h2>官号 vs 达人：谁在真正带来声量</h2><div class="spacer"></div><span class="tag seal">${E.verdict}</span></div>
      <div class="bd flush"><table class="mtx">
        <thead><tr><th>类型</th><th>条数</th><th>均赞</th><th>爆文</th><th style="text-align:left;padding-left:16px">占该品牌赞量</th></tr></thead>
        <tbody>
          ${rowEff("官号自运营", E.off_n, E.off_avg, E.off_viral, E.off_n*E.off_avg)}
          ${rowEff("达人分发", E.kol_n, E.kol_avg, E.kol_viral, E.kol_n*E.kol_avg)}
        </tbody></table></div>
    </div>

    <div class="g2">
      <div class="sheet">
        <div class="hd"><h2>最近发布</h2><div class="spacer"></div>
          <a class="btn" href="?brand=${encodeURIComponent(KEY)}&tab=library">全部 ${fmt((brandList(KEY)||[]).length)} 条</a></div>
        <div class="bd flush">${recentRows || `<div style="padding:16px" class="tiny">暂无</div>`}</div>
      </div>
      <div class="sheet">
        <div class="hd"><h2>最高赞</h2><div class="spacer"></div><span class="tag">单条峰值 ${fmt(D.likes_max)}</span></div>
        <div class="bd flush">${topRows || `<div style="padding:16px" class="tiny">暂无</div>`}</div>
      </div>
    </div>

    <div class="note seal"><b>对我们的含义：</b>${
      KEY==="COSMOBOUNTY" ? "我们的内容单条质量已经接近对手（均赞 181），差距全在「量」和「阵地」——没有官号，没有稳定发布节奏，达人只有 28 位。要追的不是质量，是先建立官号阵地、把月产能拉到 30 条以上。"
      : KEY==="GRANVER" ? "GRANVER 是最像我们的对手：产品线多、官号空转、靠达人硬铺。它的失败恰好证明——铺量不解决归属，用户看完记不住是哪个产品。"
      : `${B.cn} 的声量几乎全部来自达人，这意味着它的内容能力是可复制的（找到同样的达人就行）。它真正的壁垒在${KEY==="LAIFE"?"官号矩阵的搜索占位密度——把上千条官号内容铺在所有相关关键词上":"品牌词的自然搜索承接"}，这是我们要补的功课。`
    }</div>
  </div>`;
}
function rowEff(label,n,avg,viral,total){
  const share = D && D.likes_sum ? Math.round(total/D.likes_sum*100) : 0;
  return `<tr><td>${label}</td><td>${n?fmt(n):"—"}</td><td>${n?avg:"—"}</td><td>${n?viral:"—"}</td>
    <td style="text-align:left;padding-left:16px;font-family:var(--sans)">
      <div style="display:flex;align-items:center;gap:9px">
        <div class="bar-track" style="flex:1;max-width:180px"><div class="bar-fill" style="width:${share}%;background:${share>50?"var(--seal)":"var(--rule-2)"}"></div></div>
        <span style="font-family:var(--mono);font-size:12px">${share}%</span>
      </div></td></tr>`;
}
function catOverview(){
  const c = DATA.category;
  return `<div class="stack">
    <div class="kpis">
      <div class="kpi"><div class="k">泛品类内容</div><div class="v">${c.total}</div><div class="x">非品牌归属，不进横评</div></div>
      <div class="kpi"><div class="k">累计赞</div><div class="v">${fmt(c.likes_sum)}</div><div class="x">均 ${c.likes_avg} / 条</div></div>
      <div class="kpi"><div class="k">爆文（≥1000）</div><div class="v">${c.viral1k}</div><div class="x">占 ${pct(c.viral1k,c.total)}</div></div>
      <div class="kpi"><div class="k">对比六品牌</div><div class="v">1.4×</div><div class="x">声量是六品牌总和的倍数</div></div>
    </div>
    <div class="note">这 ${fmt((brandList("__category")||[]).length)} 条命中品类/场景词但正文未提任何品牌，按口径归入「蹭词位」，不参与品牌横评。但它们代表<b>赛道真实流量</b>——这里是品牌要抢的战场。点标题可看原文与评论区。</div>
    <div class="sheet"><div class="hd"><h2>赛道 Top 内容</h2><div class="spacer"></div>
      <a class="btn" href="brand.html?brand=__category&tab=library">看全部 ${fmt((brandList("__category")||[]).length)} 条</a></div>
      <div class="bd flush">${(brandList("__category")||[]).slice(0,15).map(contentRow).join("") || `<div style="padding:18px" class="tiny">暂无</div>`}</div></div>
  </div>`;
}

/* ================= ④ 内容库 ================= */
/* 内容行格式（list-<slug>.js）：[id, 标题, 平台, 作者, 赞, 日期, 官号0/1, 媒介(0无/1图/2视频), url, 封面] */
const MEDIA_MARK = { 0:'<span class="muted">无素材</span>', 1:'图', 2:'视频' };

/* —— 筛选状态：全部放到 URL 里，刷新/后退/分享都不丢 —— */
const LIB_PAGE = 60;
const LIB_KEYS = ["p","t","m","d","lk","acc","s","q"];
let libState = { p:"", t:"", m:"", d:"", lk:"", acc:"", s:"top", q:"" };
let libShown = LIB_PAGE;

(function initLibState() {
  const q = new URLSearchParams(location.search);
  LIB_KEYS.forEach(k => { const v = q.get(k); if (v) libState[k] = v; });
  if (["top", "recent", "old", "title"].indexOf(libState.s) < 0) libState.s = "top";
})();

/* 数据截止日：取该品牌清单里最大的发布日期，用来算「近 N 天」 */
function libRefDate() {
  let mx = "";
  (brandList(KEY) || []).forEach(x => { if (x[5] && x[5] > mx) mx = x[5]; });
  return mx || (typeof DATA !== "undefined" && DATA.generated) || "";
}
function libDays(dateStr, ref) {
  if (!dateStr) return 1e9;
  const a = Date.parse(dateStr + "T00:00:00Z"), b = Date.parse(ref + "T00:00:00Z");
  if (isNaN(a) || isNaN(b)) return 1e9;
  return (b - a) / 86400000;
}
function libYears(L) {
  const ys = {};
  L.forEach(x => { const y = (x[5] || "").slice(0, 4); if (y) ys[y] = (ys[y] || 0) + 1; });
  return Object.keys(ys).sort().reverse().map(y => [y, y + " 年（" + ys[y] + " 条）"]);
}
function libAccounts(L) {
  const m = {};
  L.forEach(x => { if (x[3]) m[x[3]] = (m[x[3]] || 0) + 1; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function libOpts(pairs, cur) {
  return pairs.map(([v, lb]) => `<option value="${esc(v)}"${String(cur) === String(v) ? " selected" : ""}>${esc(lb)}</option>`).join("");
}

/* 一行筛选条件 → 过滤函数（顺序：时间 → 平台 → 账号类型 → 互动 → 素材 → 作者 → 关键词） */
function libFiltered() {
  const ref = libRefDate();
  let list = [...(brandList(KEY) || [])];
  /* 时间条件：纯数字 = 近 N 天；y2026 = 该年份；2026-10 = 该月（数据表现页点月份下钻用） */
  if (libState.d) {
    if (libState.d.indexOf("-") > 0) {
      const ym = libState.d.slice(0, 7);
      list = list.filter(x => (x[5] || "").slice(0, 7) === ym);
    } else if (libState.d[0] === "y") {
      const y = libState.d.slice(1);
      list = list.filter(x => (x[5] || "").slice(0, 4) === y);
    } else {
      const n = parseInt(libState.d, 10);
      if (n > 0) list = list.filter(x => libDays(x[5], ref) <= n);
    }
  }
  if (libState.p) list = list.filter(x => x[2] === libState.p);
  if (libState.t === "o") list = list.filter(x => x[6] === 1);
  if (libState.t === "k") list = list.filter(x => x[6] !== 1);
  if (libState.lk) {
    const g = x => x[4] || 0;
    const rules = {
      w: x => g(x) >= 10000,
      k: x => g(x) >= 1000 && g(x) < 10000,
      h: x => g(x) >= 100 && g(x) < 1000,
      u: x => g(x) < 100,
      z: x => g(x) === 0
    };
    if (rules[libState.lk]) list = list.filter(rules[libState.lk]);
  }
  if (libState.m === "v") list = list.filter(x => x[7] === 2);
  if (libState.m === "i") list = list.filter(x => x[7] === 1);
  if (libState.m === "c") list = list.filter(x => !!x[9]);
  if (libState.m === "off") list = list.filter(x => !!x[9] || x[7] === 2);
  if (libState.m === "n") list = list.filter(x => x[7] === 0 && !x[9]);
  if (libState.acc) list = list.filter(x => x[3] === libState.acc);
  const q = (libState.q || "").trim().toLowerCase();
  if (q) list = list.filter(x => ((x[1] || "") + " " + (x[3] || "")).toLowerCase().includes(q));

  if (libState.s === "recent") list.sort((a, b) => (b[5] || "").localeCompare(a[5] || ""));
  else if (libState.s === "old") list.sort((a, b) => (a[5] || "").localeCompare(b[5] || ""));
  else if (libState.s === "title") list.sort((a, b) => (a[1] || "").localeCompare(b[1] || "", "zh"));
  else list.sort((a, b) => (b[4] || 0) - (a[4] || 0));
  return list;
}

function libSyncUrl() {
  const q = new URLSearchParams(location.search);
  q.set("tab", "library");
  LIB_KEYS.forEach(k => { if (libState[k]) q.set(k, libState[k]); else q.delete(k); });
  /* file:// 打开时浏览器会拒绝 replaceState，这里不该把整页渲染带崩 */
  try { history.replaceState(null, "", location.pathname + "?" + q.toString()); } catch (e) {}
}

function libSummary(list) {
  const n = list.length;
  const sum = list.reduce((s, x) => s + (x[4] || 0), 0);
  const avg = n ? Math.round(sum / n) : 0;
  const viral = list.filter(x => (x[4] || 0) >= 1000).length;
  const off = list.filter(x => x[6] === 1).length;
  return { n, sum, avg, viral, off };
}

      <a class="tiny" href="${contentHref(KEY, id)}" style="border-bottom:1px dotted var(--ink-4)">打开</a>
      <a class="tiny" href="create.html?brand=${encodeURIComponent(KEY)}&ref=${encodeURIComponent((t||'').slice(0,24))}" style="margin-left:9px;border-bottom:1px dotted var(--ink-4)">借用</a>
    </div>

function tabLibrary() {
  const L = brandList(KEY);
  const n = L ? L.length : (D ? D.verified : 0);
  if (!L) {
    return `<div class="stack"><div class="note">该维度没有内容清单（品类大盘的内容不归属任何品牌）。</div></div>`;

      —— 原文全文、图片/视频（本地归档可直接播放）、互动指标、归属证据、评论区、同一账号的其他内容都在那一页。

    <div class="sheet">

      <div class="filters">

        <select id="f-t">${libOpts([["", "全部"], ["o", "仅官号"], ["k", "仅达人"]], libState.t)}</select>

        <select id="f-lk">${libOpts([["", "全部"], ["w", "≥ 1 万赞"], ["k", "1000–9999 赞"], ["h", "100–999 赞"], ["u", "< 100 赞"], ["z", "0 赞"]], libState.lk)}</select>
        <label>素材</label>
        <select id="f-m">${libOpts([["", "全部"], ["off", "可离线还原"], ["v", "含视频"], ["c", "有封面"], ["i", "仅图片"], ["n", "无素材"]], libState.m)}</select>
        <label>具体账号</label>
        <select id="f-acc" style="max-width:190px">${libOpts([["", "不限"]].concat(accs.slice(0, 60).map(([a, c]) => [a, a + "（" + c + "）"])), libState.acc)}</select>
        <label>排序</label>
        <select id="f-s">${libOpts([["top", "按赞降序"], ["recent", "发布时间 新→旧"], ["old", "发布时间 旧→新"], ["title", "按标题"]], libState.s)}</select>
        <label>搜索</label>
        <input id="f-q" type="search" value="${esc(libState.q)}" placeholder="标题 / 账号关键词" style="min-width:140px">

  const $ = id => document.getElementById(id);
  const els = { p: $("f-p"), t: $("f-t"), m: $("f-m"), d: $("f-d"), lk: $("f-lk"),
                acc: $("f-acc"), s: $("f-s"), q: $("f-q") };
  const more = $("f-more");
  if (!els.p) return;

  function draw() {
    const list = libFiltered();
    const slice = list.slice(0, libShown);
    const st = libSummary(list);
    $("clist").innerHTML = slice.length
      ? slice.map(contentRow).join("")
      : `<div style="padding:26px 16px" class="tiny">这一组筛选条件下没有内容。把「时间 / 互动 / 素材」放宽一些再试。</div>`;
    $("f-sum").innerHTML = `
      <span><b>${fmt(st.n)}</b> 条</span>
      <span>累计赞 <b>${fmt(st.sum)}</b></span>
      <span>均赞 <b>${st.avg}</b></span>
      <span>其中爆文 <b>${st.viral}</b> 条</span>
      <span>官号 <b>${st.off}</b> / 达人 <b>${st.n - st.off}</b></span>`;
    $("f-cnt").textContent = st.n > slice.length ? `已显示 ${slice.length} / ${st.n}` : "";
    more.style.display = st.n > libShown ? "" : "none";
    libSyncUrl();
  }
  function reset() {
    libState = { p:"", t:"", m:"", d:"", lk:"", acc:"", s:"top", q:"" };
    Object.keys(els).forEach(k => { if (els[k]) els[k].value = k === "s" ? "top" : ""; });
    libShown = LIB_PAGE;
    draw();
  }
  Object.keys(els).forEach(k => {
    const el = els[k];
    if (!el) return;
    const ev = k === "q" ? "input" : "change";
    el.addEventListener(ev, () => {
      libState[k] = el.value;
      libShown = LIB_PAGE;
      draw();
    });
  });
  more.addEventListener("click", () => { libShown += LIB_PAGE * 2; draw(); });
  const rb = $("f-reset");
  if (rb) rb.addEventListener("click", reset);
  draw();
}
