services:
  niling:
    build: .
    image: niling-guancha:latest
    container_name: niling-guancha
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 数据卷独立：每天同步新库只需替换 data/cosmobounty.db，容器不用重建
      - ./data:/app/data:ro
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
